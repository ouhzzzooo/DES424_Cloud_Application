_format_version: "3.0"
_transform: true

services:
  - name: postgrest
    url: http://rest:3000
    routes:
      - name: postgrest-route
        paths:
          - /rest/v1

  - name: gotrue
    url: http://auth:9999
    routes:
      - name: gotrue-route
        paths:
          - /auth/v1

  - name: realtime
    url: http://realtime:4000
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
        - Prefer
        - X-Client-Info
        - apikey
      exposed_headers:
        - Content-Range
        - Content-Type
        - Content-Length
      credentials: true
      max_age: 3600

