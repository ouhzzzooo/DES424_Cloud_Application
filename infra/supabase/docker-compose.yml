version: "3.8"

services:
  studio:
    image: supabase/studio:latest
    ports:
      - "3000:3000"
    environment:
      SUPABASE_URL: http://kong:8000
      STUDIO_PG_META_URL: http://meta:8080
    depends_on:
      - kong
      - meta
    networks:
      - supabase

  kong:
    image: kong:2.8.1
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - auth
      - rest
      - realtime
      - storage
    networks:
      - supabase

  auth:
    image: supabase/gotrue:latest
    env_file:
      - .env
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - meta
    networks:
      - supabase

  rest:
    image: postgrest/postgrest:latest
    env_file:
      - .env
    environment:
      PGRST_DB_URI: postgresql://postgres:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/postgres
      PGRST_DB_SCHEMA: public,storage,graphql_public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - meta
    networks:
      - supabase

  realtime:
    image: supabase/realtime:latest
    env_file:
      - .env
    environment:
      DB_HOST: ${RDS_ENDPOINT}
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 4000
      API_JWT_SECRET: ${JWT_SECRET}
    networks:
      - supabase

  storage:
    image: supabase/storage-api:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@${RDS_ENDPOINT}:5432/postgres
      FILE_STORAGE_BACKEND: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      - rest
    networks:
      - supabase

  meta:
    image: supabase/postgres-meta:latest
    env_file:
      - .env
    environment:
      PG_META_DB_HOST: ${RDS_ENDPOINT}
      PG_META_DB_PORT: 5432
      PG_META_DB_DATABASE: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - supabase

networks:
  supabase:
    driver: bridge

